[profile.default]
# THE SAME COMPILER SETTINGS AS THE FIRST HOST THAT LINKS THIS LIBRARY (Lettery TF), so the
# solver tested here is the solver that host deploys. A deployed library's address comes from
# its exact bytecode, and the bytecode moves with every one of these settings.
evm_version = "paris"
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 1
remappings = ["forge-std/=lib/forge-std/src/"]
# Test runs only: test/Exhaustive.t.sol walks 40,000 calls in one test, far past the default
# block gas limit. This does not touch the library's compiled bytes.
gas_limit = "9223372036854775807"

[fuzz]
runs = 256

# The build that deploys: the library with nothing sorting before src/ in the compile (KNOWN_ISSUES).
# Run with FOUNDRY_PROFILE=deployable forge test
[profile.deployable]
test = "test-deployable"
out = "out/deployable"            # its own build, so the main build's copy of the library is not reused
cache_path = "cache/deployable"
